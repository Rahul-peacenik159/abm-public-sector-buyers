name: run

# Run on GitHub's servers: Actions tab > "run" > Run workflow.
# Results: table on the run's Summary page + downloadable "results" artifact (CSV/JSONL).
#
# PRIVACY: in a PUBLIC repo, run logs, summaries and artifacts are visible to others.
# Scan public sample lists here; run your real account list in a PRIVATE copy of this repo.

on:
  workflow_dispatch:
    inputs:
      config:
        description: "Category file in the repo"
        type: string
        default: "config/category.yaml"
      sam_days:
        description: "SAM.gov notices posted in the last N days (needs SAM_API_KEY secret)"
        type: string
        default: "30"

  # Weekly run (uses the defaults in the env block). Uncomment to enable.
  # schedule:
  #   - cron: "23 4 * * 1"   # Mondays 04:23 UTC

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CONFIG: ${{ inputs.config || 'config/category.yaml' }}
      SAM_DAYS: ${{ inputs.sam_days || '30' }}
      SAM_API_KEY: ${{ secrets.SAM_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore previous run (for "what's new")
        uses: actions/cache/restore@v5
        with:
          path: out/snapshots
          key: snapshots-abm-public-sector-buyers-${{ github.run_id }}
          restore-keys: snapshots-abm-public-sector-buyers-

      - name: Run
        run: |
          set -f
          python -m public_sector run --config "$CONFIG" --sam-days "$SAM_DAYS" --out out

      - name: Results table on the Summary page
        if: always()
        run: |
          if [ -d out ]; then python -m public_sector summary out >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Save state for next run
        if: always()
        uses: actions/cache/save@v5
        with:
          path: out/snapshots
          key: snapshots-abm-public-sector-buyers-${{ github.run_id }}

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: results
          path: |
            out/*.csv
            out/*.md
            out/*.jsonl
            out/*.json
          retention-days: 30
